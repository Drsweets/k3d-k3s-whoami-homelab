apiVersion: k3d.io/v1alpha5
kind: Simple
metadata:
  name: k3s-homelab
servers: 1
agents: 1
image: rancher/k3s:v1.30.2-k3s1
ports:
  - port: 80:80
    nodeFilters:
      - loadbalancer
  - port: 443:443
    nodeFilters:
      - loadbalancer
options:
  k3s:
    extraArgs:
      - arg: --tls-san=192.168.1.13
        nodeFilters:
          - server:*
