apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: homelab-gitops
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/Drsweets/k3d-k3s-whoami-homelab.git
    targetRevision: HEAD
    path: manifests

  destination:
    server: https://kubernetes.default.svc
    namespace: homelab-demo

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
